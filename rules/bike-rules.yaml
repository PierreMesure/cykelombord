      services: [Tåg i Bergslagen]
    bicycle:
      permission: conditional
      bike_booking: unknown
      ticket_purchase: advance_only
      fare: {kind: free}
      capacity: {kind: variable, per: train, note: "Capacity depends on train type."}
      conditions:
        - {kind: secure_bike, description: "Some trains lack bicycle-space safety belts; straps may allow carriage at staff discretion."}
        - {kind: capacity_discretion, description: "Train staff may refuse a bicycle when space is unavailable."}
    evidence:
      - {page: 5, locator: "Regioner > Bergslagen"}
      - {page: 8, locator: "Cykel på regionala tåg > Bergslagen"}

  - id: tag-i-bergslagen-regina
    priority: 200
    match:
      modes: [rail]
      agencies: [Tåg i Bergslagen]
