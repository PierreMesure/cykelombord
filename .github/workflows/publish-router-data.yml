name: Publish router data

on:
  schedule:
    - cron: "15 06 * * *"
  workflow_dispatch:
    inputs:
      force_source_rebuild:
        description: Re-download and prune GTFS even when feed_info is not dated today
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DATA_BASE_URL: https://cdn.cykelombord.mesu.re
      TRAFIKLAB_GTFS_API_KEY: ${{ secrets.TRAFIKLAB_GTFS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra gtfs-validation
      - run: npm --prefix frontend ci
      - name: Check Trafiklab feed version
        id: feed
        run: |
          uv run cykelombord gtfs has-update | tee /tmp/feed-info.txt
          version="$(sed -n 's/^feed_version=//p' /tmp/feed-info.txt)"
          available="$(sed -n 's/^update_available=//p' /tmp/feed-info.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - name: Check for prior published data
        id: published
        run: |
          if curl --fail --silent --show-error --output /dev/null "$DATA_BASE_URL/bike.gtfs.zip"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build a new pruned feed
        if: steps.feed.outputs.available == 'true' || inputs.force_source_rebuild == true || steps.published.outputs.exists != 'true'
        run: uv run cykelombord pipeline update --days 90
      - name: Reuse the current pruned feed
        if: steps.feed.outputs.available != 'true' && inputs.force_source_rebuild != true && steps.published.outputs.exists == 'true'
        run: |
          mkdir -p data/generated/gtfs
          curl --fail --silent --show-error --location --output data/generated/gtfs/bike.gtfs.zip "$DATA_BASE_URL/bike.gtfs.zip"
          curl --fail --silent --show-error --location --output data/generated/gtfs/manifest.json "$DATA_BASE_URL/manifest.json"
          curl --fail --silent --show-error --location --output data/generated/gtfs/route-metadata.json "$DATA_BASE_URL/route-metadata.json"
          curl --fail --silent --show-error --location --output data/generated/gtfs/rules-resolved.json "$DATA_BASE_URL/rules-resolved.json"
          uv run cykelombord gtfs validate
          uv run cykelombord router build --days 90
      - name: Stage Pages assets at the site root
        run: |
          mkdir -p data/pages
          cp data/generated/gtfs/* data/pages/
          cp data/generated/router/* data/pages/
          cp data/generated/validation/* data/pages/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: data/pages
      - name: Deploy data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
