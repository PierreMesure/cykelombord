[project]
name = "cykelpatag"
version = "0.1.0"
description = "Build bicycle-friendly Swedish public transport routing data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "gtfs-guru==0.9.3",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.16,<1",
]

[project.scripts]
cykelpatag = "cykelpatag.cli:app"

[project.optional-dependencies]
guide = [
    "pymupdf4llm>=1.27.2.1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0.12.20250822,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cykelpatag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cykelpatag"]
